services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: agc-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - agc-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: agc-postgres
    environment:
      POSTGRES_DB: agcdb
      POSTGRES_USER: agc
      POSTGRES_PASSWORD: agcpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agc -d agcdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: agc-backend
    environment:
      DATABASE_URL: postgresql://agc:agcpassword@postgres:5432/agcdb
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - agc-net
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: agc-simulator
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      - mosquitto
      - backend
    networks:
      - agc-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: agc-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agc-net
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  postgres-data:

networks:
  agc-net:
    driver: bridge
