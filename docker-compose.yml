services:
  postgres:
    image: postgres:16-alpine
    container_name: agc-postgres
    environment:
      POSTGRES_DB: agcdb
      POSTGRES_USER: agc
      POSTGRES_PASSWORD: agcpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agc-net
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agc -d agcdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: agc-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agc:agcpassword@postgres:5432/agcdb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agc-net
    restart: unless-stopped
    mem_limit: 256m

  frontend:
    build: ./frontend
    container_name: agc-frontend
    ports:
      - "127.0.0.1:9003:80"
    depends_on:
      - backend
    networks:
      - agc-net
    restart: unless-stopped
    mem_limit: 64m

volumes:
  postgres-data:

networks:
  agc-net:
    driver: bridge
